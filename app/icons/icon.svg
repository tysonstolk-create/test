<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="round">
      <rect width="512" height="512" rx="100" ry="100"/>
    </clipPath>
    <radialGradient id="bg" cx="38%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#243f78"/>
      <stop offset="100%" stop-color="#162846"/>
    </radialGradient>
    <!-- White outline via morphology dilation -->
    <filter id="white-outline" x="-15%" y="-15%" width="130%" height="130%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="10" result="expanded"/>
      <feFlood flood-color="white" result="white"/>
      <feComposite in="white" in2="expanded" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="white-outline-sm" x="-15%" y="-15%" width="130%" height="130%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="5" result="expanded"/>
      <feFlood flood-color="white" result="white"/>
      <feComposite in="white" in2="expanded" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bg)"/>

  <!-- Diagonal shine -->
  <ellipse cx="170" cy="155" rx="230" ry="170" fill="#2d508f" opacity="0.35" clip-path="url(#round)"/>

  <g clip-path="url(#round)">

    <!-- SINCE 1956 -->
    <text x="256" y="100"
      text-anchor="middle"
      font-family="'Arial Rounded MT Bold', 'Gill Sans Ultra Bold', Arial, sans-serif"
      font-size="40" font-weight="700" letter-spacing="4"
      fill="white" filter="url(#white-outline-sm)" opacity="0.0"/>
    <text x="256" y="100"
      text-anchor="middle"
      font-family="'Arial Rounded MT Bold', 'Gill Sans Ultra Bold', Arial, sans-serif"
      font-size="40" font-weight="700" letter-spacing="4"
      fill="white">SINCE 1956</text>

    <!-- Jersey -->
    <text x="256" y="248"
      text-anchor="middle"
      font-family="'Arial Rounded MT Bold', 'Gill Sans Ultra Bold', 'Cooper Black', 'Arial Black', sans-serif"
      font-size="148" font-weight="900" font-style="italic"
      fill="#CC1F1F"
      filter="url(#white-outline)">Jersey</text>

    <!-- Mike's -->
    <text x="262" y="388"
      text-anchor="middle"
      font-family="'Arial Rounded MT Bold', 'Gill Sans Ultra Bold', 'Cooper Black', 'Arial Black', sans-serif"
      font-size="136" font-weight="900" font-style="italic"
      fill="#CC1F1F"
      filter="url(#white-outline)">Mike's&#174;</text>

    <!-- SUBS -->
    <text x="256" y="448"
      text-anchor="middle"
      font-family="'Arial Rounded MT Bold', 'Gill Sans Ultra Bold', Arial, sans-serif"
      font-size="46" font-weight="700" letter-spacing="10"
      fill="white">SUBS</text>

  </g>
</svg>
