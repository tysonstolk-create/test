<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="round">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- Navy background -->
  <rect width="512" height="512" rx="112" ry="112" fill="#1B3566"/>

  <g clip-path="url(#round)">
    <!-- Subtle diagonal shine -->
    <ellipse cx="160" cy="140" rx="220" ry="180" fill="#243f78" opacity="0.5"/>

    <!-- SINCE 1956 -->
    <text x="256" y="108" text-anchor="middle"
      font-family="Arial, sans-serif" font-size="38" font-weight="700"
      letter-spacing="5" fill="white" opacity="0.9">SINCE 1956</text>

    <!-- White outline shadow for Jersey -->
    <text x="256" y="222" text-anchor="middle"
      font-family="Arial Black, Arial, sans-serif" font-size="110" font-weight="900"
      font-style="italic" fill="white" stroke="white" stroke-width="12">Jersey</text>
    <!-- Jersey in red -->
    <text x="256" y="222" text-anchor="middle"
      font-family="Arial Black, Arial, sans-serif" font-size="110" font-weight="900"
      font-style="italic" fill="#CC2222">Jersey</text>

    <!-- White outline for Mike's -->
    <text x="256" y="342" text-anchor="middle"
      font-family="Arial Black, Arial, sans-serif" font-size="105" font-weight="900"
      font-style="italic" fill="white" stroke="white" stroke-width="12">Mike's®</text>
    <!-- Mike's in red -->
    <text x="256" y="342" text-anchor="middle"
      font-family="Arial Black, Arial, sans-serif" font-size="105" font-weight="900"
      font-style="italic" fill="#CC2222">Mike's®</text>

    <!-- SUBS -->
    <text x="256" y="428" text-anchor="middle"
      font-family="Arial, sans-serif" font-size="48" font-weight="700"
      letter-spacing="14" fill="white" opacity="0.9">SUBS</text>
  </g>
</svg>
