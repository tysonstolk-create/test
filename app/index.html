<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Jersey Mike's" />
  <meta name="theme-color" content="#1B3566" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <title>Jersey Mike's</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #1B3566;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* ── SPLASH SCREEN ── */
    #splash {
      position: fixed;
      inset: 0;
      background-color: #1B3566;
      background-image: url('bg.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 10;
      cursor: pointer;
      transition: opacity 0.5s ease;
    }

    #splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .tap-hint {
      margin-bottom: 60px;
      color: rgba(255,255,255,0.8);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-shadow: 0 1px 6px rgba(0,0,0,0.6);
    }

    /* ── COUPON SCREEN ── */
    #coupon {
      position: fixed;
      inset: 0;
      background: #f5f5f5;
      overflow-y: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.5s ease;
      padding: 16px;
    }

    #coupon.visible {
      opacity: 1;
    }

    .coupon-card {
      background: #fff;
      border: 3px dashed #9daec8;
      border-radius: 8px;
      width: 100%;
      max-width: 420px;
      padding: 24px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .buy-one-row {
      display: flex;
      align-items: flex-start;
      gap: 4px;
    }

    .buy-one-big {
      color: #1B3566;
      font-size: 3.4rem;
      font-weight: 900;
      font-family: 'Arial Black', Arial, sans-serif;
      line-height: 0.9;
      flex: 1;
    }

    .regular-sub-stack {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding-top: 6px;
    }

    .regular-label {
      color: #1B3566;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.2;
    }

    .sub-label {
      color: #1B3566;
      font-size: 1.6rem;
      font-weight: 900;
      font-family: 'Arial Black', Arial, sans-serif;
      line-height: 1;
    }

    .get-one-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .get-one-script {
      color: #7a9bbf;
      font-size: 2.2rem;
      font-style: italic;
      font-weight: 400;
      font-family: Georgia, serif;
      flex-shrink: 0;
    }

    .regular-sub-free {
      display: flex;
      flex-direction: column;
    }

    .reg-sub-star {
      color: #1B3566;
      font-size: 1.3rem;
      font-weight: 900;
      font-family: 'Arial Black', Arial, sans-serif;
      line-height: 1;
    }

    .free-text {
      color: #7a9bbf;
      font-size: 3.2rem;
      font-weight: 900;
      font-family: 'Arial Black', Arial, sans-serif;
      line-height: 0.95;
    }

    .middle-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 4px;
    }

    .jm-badge {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid #CC2222;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .badge-since {
      color: #1B3566;
      font-size: 0.45rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .badge-jersey {
      color: #CC2222;
      font-size: 0.75rem;
      font-weight: 900;
      font-style: italic;
      font-family: 'Arial Black', Arial, sans-serif;
      line-height: 1;
    }

    .badge-mikes {
      color: #CC2222;
      font-size: 0.7rem;
      font-weight: 900;
      font-style: italic;
      font-family: 'Arial Black', Arial, sans-serif;
      line-height: 1;
    }

    .badge-subs {
      color: #1B3566;
      font-size: 0.45rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .equal-lesser {
      color: #555;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .star-red { color: #CC2222; }

    .offer-banner {
      background: #1B3566;
      color: #fff;
      text-align: center;
      padding: 8px 6px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      border-radius: 4px;
    }

    .fine-print {
      color: #555;
      font-size: 0.72rem;
      text-align: center;
      line-height: 1.5;
    }

    .barcode-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-top: 4px;
    }

    .barcode {
      width: 100%;
      height: 50px;
      display: flex;
      align-items: stretch;
      gap: 1px;
      overflow: hidden;
    }

    .barcode-num {
      color: #333;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>

  <!-- SPLASH -->
  <div id="splash" onclick="openCoupon()">
    <div class="tap-hint">Tap to open coupon</div>
  </div>

  <!-- COUPON -->
  <div id="coupon">
    <div class="coupon-card">

      <!-- BUY ONE -->
      <div class="buy-one-row">
        <div class="buy-one-big">BUY<br>ONE</div>
        <div class="regular-sub-stack">
          <div class="regular-label">REGULAR</div>
          <div class="sub-label">SUB</div>
        </div>
      </div>

      <!-- GET ONE FREE -->
      <div class="get-one-row">
        <div class="get-one-script">Get One</div>
        <div class="regular-sub-free">
          <div class="reg-sub-star">REGULAR SUB<span class="star-red">*</span></div>
          <div class="free-text">FREE!</div>
        </div>
      </div>

      <!-- LOGO + DISCLAIMER -->
      <div class="middle-row">
        <div class="jm-badge">
          <div class="badge-since">SINCE 1998</div>
          <div class="badge-jersey">Jersey</div>
          <div class="badge-mikes">Mike's<sup style="font-size:0.4rem">®</sup></div>
          <div class="badge-subs">SUBS</div>
        </div>
        <div class="equal-lesser">
          <span class="star-red">*</span>of equal or<br>lesser value.
        </div>
      </div>

      <!-- BANNER -->
      <div class="offer-banner">OFFER ONLY VALID AT PARTICIPATING LOCATIONS</div>

      <!-- FINE PRINT -->
      <div class="fine-print">
        One coupon per person per visit per day. Not to be combined<br>
        with other offers. No cash value. Not valid online.
      </div>

      <!-- BARCODE -->
      <div class="barcode-area">
        <div class="barcode" id="barcode"></div>
        <div class="barcode-num">0718</div>
      </div>

    </div>
  </div>

  <script>
    const bc = document.getElementById('barcode');
    const pattern = [3,1,2,1,3,2,1,2,1,3,1,2,3,1,1,2,3,1,2,1,1,3,2,1,3,1,2,1,3,2,1,1,3,2,1,3,1,2,1,2,3,1,2,1,3,1,2,3,1,1,2,1,3,1,2,3,1,2,1,3,2,1,1,3,2,1,3];
    pattern.forEach((w, i) => {
      const bar = document.createElement('div');
      bar.style.cssText = `flex: ${w}; background: ${i % 2 === 0 ? '#111' : '#fff'}; height: 100%;`;
      bc.appendChild(bar);
    });

    function openCoupon() {
      const splash = document.getElementById('splash');
      const coupon = document.getElementById('coupon');
      splash.classList.add('fade-out');
      coupon.classList.add('visible');
      splash.addEventListener('transitionend', () => splash.remove(), { once: true });
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
